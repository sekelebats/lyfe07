[build]
  command = "npm run build"
  publish = "public"

# HTML — jangan cache sama sekali selama development
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate, no-cache, no-store"

# CSS — no cache dulu biar perubahan langsung kelihatan
[[headers]]
  for = "/app.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate, no-cache, no-store"

# Images — immutable karena filename unik per size
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"