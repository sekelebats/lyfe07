content:
  - name: gallery
    label: Gallery
    type: collection
    path: content/gallery
    format: yaml-frontmatter   # ← ini yang benar untuk file .md
    filename: "{primary}.md"   # ← pastikan output .md
    fields:
      - name: title
        label: Judul / Caption
        type: string
        required: true
      - name: photos
        label: Foto
        type: image
        options:
          media: images
          multiple:
            max: 20
          extensions: [jpg, jpeg, png, webp, avif]